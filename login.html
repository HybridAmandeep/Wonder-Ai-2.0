<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — WanderAI</title>
    <meta name="description" content="Log in to your WanderAI account to access your trips, wishlist, and itineraries.">
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="site-body">

    <!-- TOP UTILITY BAR -->
    <div class="top-bar">
        <div class="top-bar-container">
            <div class="top-bar-left">
                <span class="top-bar-item"><i data-lucide="shield-check"></i> Best Price Guarantee</span>
            </div>
            <div class="top-bar-right">
                <a href="signup.html" class="top-utility-link">Register Account</a>
            </div>
        </div>
    </div>

    <!-- MAIN DESKTOP NAVIGATION -->
    <header class="main-header" id="desktopNav">
        <div class="header-container">
            <div class="header-brand-wrap">
                <a href="index.html" class="logo">
                    <img src="assets/logo.png" alt="WanderAI Logo" class="logo-img">
                    <span class="logo-text">Wander<span class="logo-accent">AI</span></span>
                </a>
            </div>
            <div class="header-right-actions">
                <a href="index.html" class="nav-secondary-link">Back to Home</a>
            </div>
        </div>
    </header>

    <!-- AUTH LOGIN FORM CONTAINER -->
    <div class="auth-page-section page-transition">
        <div class="auth-card-wrapper">
            <div class="auth-card-header">
                <a href="index.html" class="logo" style="justify-content:center; margin-bottom:12px;">
                    <img src="assets/logo.png" alt="WanderAI Logo" class="logo-img">
                    <span class="logo-text" style="color:var(--gray-900);">Wander<span class="logo-accent">AI</span></span>
                </a>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to manage your bookings and access AI travel plans.</p>
            </div>

            <div class="social-login">
                <button type="button" class="btn-social" id="googleLoginBtn">
                    <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/><path d="M1 1h22v22H1z" fill="none"/></svg>
                    Continue with Google
                </button>
            </div>

            <div class="divider"><span>or sign in with email</span></div>

            <form id="login-form" novalidate>
                <div class="input-group">
                    <label for="email" class="field-label">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" class="search-input-field" required>
                    <div class="error-message" id="email-error"></div>
                </div>

                <div class="input-group" style="margin-top:16px;">
                    <label for="password" class="field-label">Password</label>
                    <div class="field-input-wrap">
                        <input type="password" id="password" name="password" placeholder="Enter your password" class="search-input-field" required>
                        <button type="button" class="btn-toggle-password" id="toggle-password" aria-label="Toggle password visibility">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                    <div class="error-message" id="password-error"></div>
                </div>

                <button type="submit" class="hero-submit-btn" style="margin-top: 24px;" id="submit-btn">
                    <span class="btn-text">Sign In to WanderAI</span>
                    <span class="loader" style="display: none;"></span>
                </button>
            </form>

            <div class="auth-footer-text">
                Don't have an account? <a href="signup.html" style="color:var(--brand-blue); font-weight:800;">Register Free Account</a>
            </div>
        </div>
    </div>

    <!-- SITE FOOTER -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom-flex">
                <div class="copyright-text">
                    &copy; 2026 WanderAI Technologies Inc. All rights reserved.
                </div>
            </div>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
